<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice profile: manage resumés</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1c2330; }
  header { background: #1c2330; color: #fff; padding: 12px 24px; font-weight: 600; }
  main { max-width: 640px; margin: 24px auto; background: #fff; border-radius: 12px; padding: 24px 28px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e5e7eb; position: relative; }
  small { color: #6b7280; display: block; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #c7ccd4; background: #fff; cursor: pointer; }
  .layer { position: fixed; inset: 0; background: rgb(0 0 0 / 0.4); display: flex; align-items: center; justify-content: center; }
  .layer > div { background: #fff; border-radius: 12px; padding: 20px 24px; min-width: 420px; }
  [role=menu] { position: absolute; right: 0; top: 44px; background: #fff; border: 1px solid #c7ccd4; border-radius: 8px; padding: 4px; z-index: 2; }
  [role=menuitem] { display: block; padding: 6px 12px; cursor: pointer; }
  .danger { background: #b42318; border-color: #b42318; color: #fff; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>Practice job board · not a real site</header>
<main>
  <!-- Like SEEK's profile page in Nov 2026: "Add or manage resumés (N)" opens
       a list; each resumé has an "Options for <file>" menu with Delete, then a
       confirmation ("Delete default resumé" for the default one). -->
  <h1>Your profile</h1>
  <button type="button" id="manage"></button>
  <div class="layer hidden" role="dialog" aria-modal="true" aria-labelledby="mgr-h" id="manager">
    <div>
      <h2 id="mgr-h">Resumés</h2>
      <ul id="list"></ul>
      <button type="button" id="done">Done</button>
    </div>
  </div>
  <div class="layer hidden" role="alertdialog" aria-modal="true" aria-labelledby="dlg-h" id="confirm">
    <div>
      <h3 id="dlg-h">Delete this resumé?</h3>
      <button type="button" id="dlg-cancel">Cancel</button>
      <button type="button" class="danger" id="dlg-ok"></button>
    </div>
  </div>
</main>
<script>
  const who = new URLSearchParams(location.search).get("name") || "Test Person";
  const files = [
    ["My own CV 2023.pdf", 400],
    [`${who} - Resume - Acme Bank.docx`, 30],
    [`${who} - Resume.pdf`, 20],
    [`${who} - Resume - SEEK-95446655.pdf`, 10],
    [`${who} - Resume.pdf`, 5],
    [`${who} - Resume.pdf`, 0],
  ];
  let defaultName = files[2][0];
  const list = document.getElementById("list");
  const manage = document.getElementById("manage");
  const manager = document.getElementById("manager");
  const confirmBox = document.getElementById("confirm");
  const ok = document.getElementById("dlg-ok");
  let pending = null;
  const count = () => (manage.textContent = `Add or manage resumés (${list.children.length})`);
  for (const [name, days] of files) {
    const li = document.createElement("li");
    li.innerHTML = `<div><span class="name"></span><small>${days === 0 ? "Added just now" : `Added ${days} days ago`}</small></div><button type="button" class="opts">⋯</button><div role="menu" class="hidden"><span role="menuitem">Download</span><span role="menuitem">Delete</span></div>`;
    li.querySelector(".name").textContent = name;
    const opts = li.querySelector(".opts");
    opts.setAttribute("aria-label", `Options for ${name}`);
    const menu = li.querySelector("[role=menu]");
    opts.addEventListener("click", () => menu.classList.toggle("hidden"));
    menu.children[1].addEventListener("click", () => {
      menu.classList.add("hidden");
      pending = li;
      ok.textContent = name === defaultName ? "Delete default resumé" : "Delete resumé";
      confirmBox.classList.remove("hidden");
    });
    list.append(li);
  }
  count();
  manage.addEventListener("click", () => manager.classList.remove("hidden"));
  document.getElementById("done").addEventListener("click", () => manager.classList.add("hidden"));
  document.getElementById("dlg-cancel").addEventListener("click", () => confirmBox.classList.add("hidden"));
  ok.addEventListener("click", () => {
    pending?.remove();
    confirmBox.classList.add("hidden");
    count();
  });
</script>
</body>
</html>
