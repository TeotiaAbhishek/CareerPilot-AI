# `cargo audit` settings. Each ignored advisory says why it doesn't apply.
[advisories]
ignore = [
    # zip 8.x (through docx-rs): all four are about *extracting* archives.
    # CareerPilot only writes .docx files and never opens a zip, so none of
    # them can be reached. Drop these once docx-rs moves to zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    # libsqlite3-sys is only in Cargo.lock as an optional part of sqlx.
    # CareerPilot uses Postgres, so it is never compiled.
    "RUSTSEC-2026-0459",
]
