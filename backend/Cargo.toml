[package]
name = "careerpilot-api"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
ammonia = "4.2.5"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
html2text = "0.17.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["cookies", "gzip", "json"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["serde", "v4"] }
