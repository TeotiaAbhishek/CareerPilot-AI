name: CareerPilot SEEK Scraper Test

on:
  workflow_dispatch:

jobs:
  test-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Limit scraper to one page for test
        run: |
          python - <<'PY'
          import yaml

          path = "config/searches.yaml"

          with open(path, "r") as f:
              config = yaml.safe_load(f)

          config["max_pages"] = 1

          with open(path, "w") as f:
              yaml.safe_dump(config, f, sort_keys=False)

          print("Scraper test configured for 1 page per keyword.")
          PY
      
      - name: Test database configuration
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |
          python - <<'PY'
          import os
          import socket

          host = os.environ.get("DB_HOST", "")
          port = os.environ.get("DB_PORT", "")

          print("DB_HOST secret present:", bool(host))
          print("DB_PORT secret present:", bool(port))
          print("DB_HOST contains DB_HOST=:", host.startswith("DB_HOST="))
          print("DB_HOST contains protocol:", "://" in host)

          try:
              socket.getaddrinfo(host, int(port))
              print("Database hostname resolves successfully.")
          except Exception as e:
              print("Database hostname resolution FAILED.")
              print(type(e).__name__, str(e))
              raise
          PY
      
      - name: Run SEEK scraper
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |
          python src/run_scraper.py